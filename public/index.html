<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAMADI-BOT PANEL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);color:#fff;min-height:100vh;display:flex;flex-direction:column}
.header{background:#0a1a2a;padding:15px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:22px;font-weight:bold;display:flex;align-items:center;gap:10px}
.btn-home{background:#00c896;border:none;padding:8px 15px;border-radius:8px;color:#fff}
.container{flex:1;padding:20px;max-width:500px;margin:0 auto;width:100%}
.tabs{display:flex;background:#1e2d3d;border-radius:12px;padding:5px;margin:20px 0}
.tab{flex:1;padding:12px;border:none;background:transparent;color:#aaa;border-radius:8px;font-weight:bold}
.tab.active{background:#00c896;color:#fff}
.title{text-align:center;font-size:24px;margin:20px 0;font-weight:bold}
.card{background:#1e2d3d;border-radius:15px;padding:20px;margin-bottom:15px}
.step{display:flex;gap:15px;margin-bottom:15px;align-items:center}
.step-num{background:#00c896;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold}
input{width:100%;padding:15px;background:#0f1a24;border:1px solid #2c3e50;border-radius:10px;color:#fff;font-size:16px;margin:10px 0}
.btn{width:100%;padding:15px;background:linear-gradient(90deg,#00c896,#00e6a0);border:none;border-radius:10px;color:#fff;font-size:16px;font-weight:bold;margin-top:10px}
#codeBox{background:#0f1a24;padding:20px;border-radius:10px;text-align:center;font-size:24px;letter-spacing:3px;margin-top:15px;display:none}
</style>
</head>
<body>
<div class="header">
  <div class="logo">👑 KAMADI-BOT PANEL</div>
  <button class="btn-home">🏠</button>
</div>

<div class="container">
  <div class="tabs">
    <button class="tab">QR Code</button>
    <button class="tab active">Pairing Code</button>
  </div>

  <h1 class="title">Link WA via Code</h1>

  <div class="card">
    <div class="step"><div class="step-num">1</div><div>Open WA on your phone</div></div>
    <div class="step"><div class="step-num">2</div><div>Tap <b>Linked Devices</b> → <b>Link a Device</b></div></div>
    <div class="step"><div class="step-num">3</div><div>Tap <b>Link with phone number instead</b></div></div>
  </div>

  <input type="text" id="number" placeholder="e.g. 2348012345678">
  <button class="btn" onclick="getCode()">REQUEST CODE</button>
  
  <div id="codeBox"></div>
</div>

<script>
async function getCode(){
  const num = document.getElementById('number').value;
  if(!num) return alert('Enter your number with country code');
  
  const res = await fetch(`/code?number=${num}`);
  const data = await res.json();
  
  document.getElementById('codeBox').style.display = 'block';
  document.getElementById('codeBox').innerText = data.code || data.error;
}
</script>
</body>
</html>
